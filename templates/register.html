{% extends "base.html" %}
{% block title %}Sign up - Let’s Travel{% endblock %}
{% block content %}
<section class="wrap auth">
  <h2>Create your account</h2>
  <form method="post" class="auth-card">
    <label><span>Full name</span><input name="name" value="{{ name }}" required minlength="2" maxlength="80" autocomplete="name" autofocus></label>
    <label><span>Email</span><input type="email" name="email" value="{{ email }}" required autocomplete="email"></label>
    <label><span>Password</span><input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password"><small class="muted">At least 8 characters.</small></label>
    <button type="submit">Sign up</button>
    <p class="muted">Already have an account? <a href="{{ url_for('login', next=request.args.get('next')) }}">Log in</a></p>
  </form>
</section>
{% endblock %}
